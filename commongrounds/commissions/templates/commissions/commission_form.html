<!DOCTYPE html>
<html>
<head>
    <title>Create / Edit Commission</title>
</head>
<body>
    <h1>Create / Edit Commission</h1>

    <form method="post">
        {% csrf_token %}
        
        <h3>Commission Details</h3>
        {{ form.as_p }}
        
        <hr>
        
        <h3>Required Jobs</h3>
        {{ job_formset.management_form }}
        
        {% for job_form in job_formset %}
            <div style="border: 1px solid black; padding: 10px; margin-bottom: 10px;">
                {{ job_form.as_p }}
            </div>
        {% endfor %}

        <button type="submit">Save</button>
    </form>

    <p><a href="{% url 'commissions:commission_list' %}">Back to list</a></p>
</body>
</html>
